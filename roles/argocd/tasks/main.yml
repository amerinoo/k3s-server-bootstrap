- name: Create ArgoCD namespace
  ansible.builtin.command:
    cmd: kubectl create namespace "{{ argocd_namespace }}"
  register: argocd_namespace_create
  changed_when: argocd_namespace_create.rc == 0
  failed_when:
    - argocd_namespace_create.rc != 0
    - "'AlreadyExists' not in argocd_namespace_create.stderr"

- name: Install or reconcile ArgoCD
  ansible.builtin.command:
    cmd: >-
      kubectl apply
      --server-side
      --force-conflicts
      -n "{{ argocd_namespace }}"
      -f "{{ argocd_manifest_url }}"
  register: argocd_apply
  changed_when: "'configured' in argocd_apply.stdout or 'created' in argocd_apply.stdout or 'serverside-applied' in argocd_apply.stdout"
