infra_user: infra
infra_user_shell: /bin/bash
infra_passwordless_sudo: true

infra_ssh_private_key: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519_infra' }}"
infra_ssh_public_key: "{{ infra_ssh_private_key }}.pub"

base_packages:
  - curl
  - git
  - nano
  - htop
  - jq

k3s_install_url: https://get.k3s.io
k3s_disable:
  - traefik
k3s_write_kubeconfig_mode: "0600"

ingress_nginx_manifest_url: https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
ingress_nginx_namespace: ingress-nginx
ingress_nginx_ready_timeout: 180s

argocd_namespace: argocd
argocd_manifest_url: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
